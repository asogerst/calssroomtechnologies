<!--
  HOW TO EDIT THIS FILE
  ---------------------
  Everything you will want to change is in the block marked "EDIT YOUR MAP HERE"
  inside the <script> near the bottom of this file.

  Each bubble (node) looks like this:

    {
      text:   "Bubble title",                 // required
      detail: "A short explanation",          // optional
      image:  "images/my-picture.png",        // optional: file in your repo, or a full web address
      alt:    "Describe the picture",         // please add this when you add an image
      link:   "https://example.com",          // optional: adds an "Open resource" button
      linkLabel: "Open PhET",                 // optional: changes the button wording
      open:   true,                           // optional: true = starts expanded
      children: [ ...more nodes... ]          // optional: the next bubbles along
    }

  To add a bubble: copy one { ... } block and paste it inside a "children" list.
  Remember the comma between blocks.
  To remove a bubble: delete its { ... } block.
-->

<style>
  :root {
    --bg: #f0f0e8;
    --ink: #1d2733;
    --muted: #5b6776;
    --card: #ffffff;
    --line: #b9c2cf;
    --radius: 14px;
  }

  
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
  }
  header { padding: 18px 20px 4px; }
  header h1 { margin: 0 0 4px; font-size: 1.3rem; }
  header p  { margin: 0; color: var(--muted); font-size: .92rem; }
  .toolbar { padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button {
    font: inherit; font-size: .85rem; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .toolbar button:hover { border-color: var(--ink); }

  /* The scrollable canvas */
  .viewport {
    overflow: auto;
    padding: 20px;
    min-height: 480px;
  }
  .map { position: relative; display: inline-block; min-width: 100%; }
  .map svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

  /* Tree layout: each branch = node + its children column */
  .branch { display: flex; align-items: center; }
  .children {
    display: flex; flex-direction: column; gap: 14px;
    margin-left: 56px;
  }
  .children[hidden] { display: none; }
  .branch + .branch { margin-top: 0; }

  .node {
    position: relative;
    width: 230px; flex: 0 0 auto;
    background: var(--card);
    border: 2px solid var(--c, var(--line));
    border-radius: var(--radius);
    padding: 10px 12px;
    text-align: left;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .node.root {
    background: var(--c);
    color: #fff;
    border-color: var(--c);
    width: 220px;
    font-weight: 600;
  }
  .node.root .detail { color: rgba(255,255,255,.9); }
  .node.has-kids { cursor: pointer; }
  .node.has-kids:hover { box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .node:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }

  .node .title { font-weight: 600; font-size: .95rem; padding-right: 22px; }
  .node .detail { font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .node img {
    display: block; width: 100%; max-height: 120px; object-fit: cover;
    border-radius: 8px; margin-bottom: 8px;
  }
  .node .toggle {
    position: absolute; right: 8px; top: 8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--c, var(--line)); color: #fff;
    font-size: .8rem; line-height: 20px; text-align: center; font-weight: 700;
  }
  .node.root .toggle { background: rgba(255,255,255,.3); }
  .node a.open-link {
    display: inline-block; margin-top: 8px;
    font-size: .8rem; font-weight: 600; text-decoration: none;
    color: #fff; background: var(--c, #2f6fb5);
    padding: 4px 10px; border-radius: 999px;
  }
  .node a.open-link:hover { filter: brightness(1.1); }

  .legend { padding: 0 20px 20px; color: var(--muted); font-size: .8rem; }

  @media (max-width: 600px) {
    .node { width: 190px; }
    .children { margin-left: 38px; }
  }
</style>
</head>
<body>

<div class="legend">Tip: on a small screen, drag or scroll sideways to follow the branches.</div>

(function () {
  var mapEl = document.getElementById("map");
  var viewport = document.getElementById("viewport");
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("aria-hidden", "true");
  mapEl.appendChild(svg);

  var DEFAULT_COLORS = ["#2f6fb5", "#2e8b57", "#c26a1b", "#8a4fb0", "#b23a48", "#1b8a9b"];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function build(node, depth, color, branchIndex) {
    var branch = el("div", "branch");
    var hasKids = Array.isArray(node.children) && node.children.length > 0;

    if (depth === 1) { color = node.color || DEFAULT_COLORS[branchIndex % DEFAULT_COLORS.length]; }
    if (depth === 0) { color = node.color || "#1d4e89"; }

    var n = el("div", "node" + (depth === 0 ? " root" : "") + (hasKids ? " has-kids" : ""));
    n.style.setProperty("--c", color);

    if (node.image) {
      var img = document.createElement("img");
      img.src = node.image;
      img.alt = node.alt || "";
      img.loading = "lazy";
      img.addEventListener("load", draw);
      n.appendChild(img);
    }
    n.appendChild(el("div", "title", node.text));
    if (node.detail) n.appendChild(el("div", "detail", node.detail));
    if (node.link) {
      var a = el("a", "open-link", node.linkLabel || "Open resource");
      a.href = node.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.addEventListener("click", function (e) { e.stopPropagation(); });
      n.appendChild(a);
    }

    branch.appendChild(n);

    if (hasKids) {
      var tog = el("span", "toggle");
      n.appendChild(tog);
      n.setAttribute("role", "button");
      n.setAttribute("tabindex", "0");

      var kids = el("div", "children");
      node.children.forEach(function (c, i) {
        kids.appendChild(build(c, depth + 1, color, depth === 0 ? i : branchIndex));
      });
      branch.appendChild(kids);

      var setOpen = function (open) {
        kids.hidden = !open;
        tog.textContent = open ? "\u2212" : "+";
        n.setAttribute("aria-expanded", open ? "true" : "false");
      };
      setOpen(!!node.open);
      n._setOpen = setOpen;
      n._kids = kids;

      var toggle = function () { setOpen(kids.hidden); draw(); };
      n.addEventListener("click", toggle);
      n.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    }
    return branch;
  }

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var mapRect = mapEl.getBoundingClientRect();
    svg.setAttribute("width", mapEl.scrollWidth);
    svg.setAttribute("height", mapEl.scrollHeight);

    mapEl.querySelectorAll(".branch").forEach(function (b) {
      var parent = b.querySelector(":scope > .node");
      var kids = b.querySelector(":scope > .children");
      if (!parent || !kids || kids.hidden) return;
      var pr = parent.getBoundingClientRect();
      var x1 = pr.right - mapRect.left;
      var y1 = pr.top + pr.height / 2 - mapRect.top;
      var color = getComputedStyle(parent).getPropertyValue("--c") || "#999";

      kids.querySelectorAll(":scope > .branch > .node").forEach(function (c) {
        var cr = c.getBoundingClientRect();
        var x2 = cr.left - mapRect.left;
        var y2 = cr.top + cr.height / 2 - mapRect.top;
        var mid = (x1 + x2) / 2;
        var p = document.createElementNS(svgNS, "path");
        p.setAttribute("d", "M" + x1 + "," + y1 + " C" + mid + "," + y1 + " " + mid + "," + y2 + " " + x2 + "," + y2);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", color.trim());
        p.setAttribute("stroke-width", "2.5");
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("opacity", "0.7");
        svg.appendChild(p);
      });
    });
  }

  function setAll(open) {
    mapEl.querySelectorAll(".node.has-kids").forEach(function (n, i) {
      // Keep the centre bubble open so the map never disappears
      n._setOpen(i === 0 ? true : open);
    });
    draw();
  }

  mapEl.appendChild(build(MAP, 0, null, 0));
  document.getElementById("expandAll").addEventListener("click", function () { setAll(true); });
  document.getElementById("collapseAll").addEventListener("click", function () { setAll(false); });

  window.addEventListener("resize", draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  window.addEventListener("load", draw);
  draw();
})();
</script>
